  .animated-img {
    width: 200px;
    height: auto;
    position: absolute;
    top: 10%;
    left: 25%;
    border: 10px solid blue;
    opacity: 0;
    animation: fadeIn 2s forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }
    body {
  height: 100vh; /* take up full viewport height */
  margin: 0; /* remove default margins */
  border: 10px solid Blue; /* your border style */

}

        height: 60px;
        position: absolute;
        top: 50%;
        bottom: 50%;
        left: 50%;
        right: 50%;

        textAlign: center;

}
